<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VectorSpace — internalize n dimensions</title>
<link rel="stylesheet" href="styles.css" />
<script>
  /* apply saved (or system) theme BEFORE first paint — no flash */
  (function(){
    try{
      var t=localStorage.getItem('vs-theme');
      if(t!=='light'&&t!=='dark') t='dark';   /* dark is the default look */
      document.documentElement.setAttribute('data-theme',t);
    }catch(e){ document.documentElement.setAttribute('data-theme','dark'); }
  })();
</script>
<script>
  window.MathJax = {
    tex:{inlineMath:[['\\(','\\)']], displayMath:[['$$','$$']]},
    svg:{fontCache:'global'},
    startup:{typeset:false}
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"
  onerror="window.__mathjaxFailed=true"></script>
</head>
<body>

<!-- ===================== SIDEBAR ===================== -->
<aside id="sidebar">
  <div class="brand">
    <div class="brand-title">vectorspace<span class="cursor">_</span></div>
    <button class="theme-toggle" id="themeToggle" aria-label="toggle theme" title="Toggle theme">[*]</button>
  </div>
  <div class="brand-sub">~/linear-algebra $ ls chapters/</div>
  <input id="chapSearch" type="search" placeholder="grep chapters…" autocomplete="off" />
  <nav id="chapnav"><!-- filled by JS --></nav>
  <div class="progress-wrap">
    <div class="progress-bar"><div id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0% explored</div>
  </div>
  <button class="reset-progress" id="resetProgress">reset progress</button>
</aside>

<button id="menuToggle" aria-label="menu">[=]</button>

<!-- ===================== MAIN ===================== -->
<main id="main">
  <div id="content"><!-- active chapter rendered here --></div>

  <div class="chapter-foot">
    <button class="navbtn" id="prevChap">← previous</button>
    <div class="dotline" id="dotline"></div>
    <button class="navbtn primary" id="nextChap">next →</button>
  </div>
</main>

<!-- landing overlay -->
<!-- landing: a terminal session -->
<div id="landing">
  <button class="theme-toggle landing-theme" id="themeToggleLanding" aria-label="toggle theme" title="Toggle theme">[*]</button>
  <div class="term">
    <div class="term-bar"><span class="tb-dot"></span><span class="tb-dot"></span><span class="tb-dot"></span><span class="tb-name">vectorspace — -bash — 96×28</span></div>
    <div class="term-body">
      <pre class="term-out" id="termOut"></pre>
      <div class="landing-cta">
        <button id="startBtn" class="big-cta">./start</button>
        <button id="labBtn" class="ghost-cta">./matrixlab</button>
        <button id="jumpBtn" class="ghost-cta">ls chapters/</button>
      </div>
      <div class="landing-marquee" id="landingChips"></div>
    </div>
  </div>
</div>

<script src="linalg.js"></script>
<script src="engine.js"></script>
