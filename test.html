<!DOCTYPE html>
<!-- Regression test: open in a browser (or run headless) to verify every
     widget responds to input and every practice generator grades correctly.
     Green "OK" lines = pass; any "BAD"/"ERR" = a regression. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>body{font-family:monospace;padding:20px} .OK{color:#2a8} .BAD{color:#e4572e;font-weight:bold} h2{font-family:sans-serif}</style>
</head><body>
<h2>VectorSpace widget + grading regression test</h2>
<div id="report">running…</div>
<script src="linalg.js"></script><script src="engine.js"></script>
<script>
const out=[];
function ok(name,cond){out.push({name,pass:!!cond});}
function narTxt(w){const n=w.querySelector('.narrate');return n?n.textContent:w.textContent;}

/* ---- widget interaction ---- */
try{let v=0;VS.knob({label:'x',value:5,onInput:x=>v=x});ok('knob onInput',typeof v==='number');}catch(e){ok('knob:'+e.message,false);}
try{let v=0;const r=VS.rangeRow({label:'a',min:0,max:10,value:3,onInput:x=>v=x});r.input.value='7';r.input.dispatchEvent(new Event('input'));ok('rangeRow updates',v===7);}catch(e){ok('rangeRow:'+e.message,false);}
try{let s=false;const q=VS.quiz({question:'q',options:[{t:'yes',ok:true,why:'r'},{t:'no',ok:false}],onSolved:()=>s=true});q.querySelectorAll('.opt')[0].click();ok('quiz correct→solved',s);}catch(e){ok('quiz:'+e.message,false);}
try{const g=VS.matrixGrid({rows:2,cols:2,values:[[1,2],[3,4]]});g.set([[5,6],[7,8]]);ok('matrixGrid set/get',JSON.stringify(g.get())==='[[5,6],[7,8]]');}catch(e){ok('matrixGrid:'+e.message,false);}
try{const w=VS.rrefStepper({rows:2,cols:3,values:[[1,2,3],[2,4,6]]});[...w.querySelectorAll('button')].find(b=>/run/.test(b.textContent)).click();ok('rrefStepper run',/rank/i.test(narTxt(w)));}catch(e){ok('rrefStepper:'+e.message,false);}
try{const w=VS.eigenCheck({A:[[2,1],[1,2]]});const ins=w.querySelectorAll('input');ins[0].value='1';ins[1].value='1';w.querySelector('button').click();ok('eigenCheck detects',/eigenvalue/i.test(narTxt(w)));}catch(e){ok('eigenCheck:'+e.message,false);}
try{const w=VS.matrixLab({matrix:[[2,1],[1,2]]});[...w.querySelectorAll('button')].find(b=>b.textContent.includes('singular')).click();ok('matrixLab singular',/SINGULAR|does not exist/.test(w.textContent));}catch(e){ok('matrixLab:'+e.message,false);}
try{const w=VS.transformQuiz();ok('transformQuiz 6 opts',w.querySelectorAll('.opt').length===6);}catch(e){ok('transformQuiz:'+e.message,false);}
try{const w=VS.cofactorBuilder({A:[[2,1,0],[1,3,1],[0,2,2]]});const ins=w.querySelectorAll('input');const t=ins[ins.length-1];t.value='6';t.dispatchEvent(new Event('input'));ok('cofactorBuilder total',/Correct/.test(narTxt(w)));}catch(e){ok('cofactorBuilder:'+e.message,false);}
['listAdd','systemLines','complexPlane','quadFormPlot','leastSquares','pcaCloud','luStepper','fourierSynth','configSpace','possibilityCounter','morphPath','diffVector','ladder','detArea','gallery','webGraph','analogyDemo','svdPhoto','fourRep','spanBoard','eigenExplorer','projectionBoard','board3d','numberline','worked','orthoLab','gramSchmidtViz','fourSubspaces','matmulBuilder','rowOpSolver','proofBuilder','vboard'].forEach(fn=>{
  try{let a={};
    if(fn==='listAdd')a={items:['a','b'],a:[1,2],b:[3,4]};
    if(fn==='gallery')a=[{icon:'x',name:'n',dims:'2D',vec:'(1,2)',note:'z'}];
    if(fn==='webGraph')a={nodes:[{label:'A'},{label:'B'}],edges:[[0,1,2]]};
    if(fn==='worked')a={steps:['a','b'],result:'r',prompt:'p'};
    if(fn==='board3d')a={vec:{x:1,y:1,z:1}};
    if(fn==='numberline')a={value:2};
    if(fn==='spanBoard'||fn==='vboard')a={arrows:[{x:1,y:0,color:'#000'},{x:0,y:1,color:'#111'}]};
    if(fn==='eigenExplorer')a={matrix:[[2,1],[1,2]]};
    if(fn==='projectionBoard')a={nar:VS.narrate('')};
    if(fn==='fourRep')a={x:2,y:1};
    if(fn==='matmulBuilder')a={A:[[1,2],[3,4]],B:[[2,0],[1,2]]};
    if(fn==='rowOpSolver')a={matrix:[[2,4],[1,3]]};
    if(fn==='proofBuilder')a={claim:'c',steps:[{text:'a',reason:'x',choices:['x','y']}]};
    VS[fn](a);ok('renders:'+fn,true);
  }catch(e){ok('renders:'+fn+':'+e.message,false);}
});

/* ---- grading: right passes, wrong fails ---- */
Object.keys(VS.PROBLEMS).forEach(k=>{
  try{let rp=true,wf=true;
    for(let t=0;t<20;t++){const p=VS.PROBLEMS[k]();
      const right=Array.isArray(p.answer)?p.answer.join(', '):String(p.answer);
      if(!p.check(right))rp=false;
      let wrong=k==='subspace'?(p.answer==='yes'?'no':'yes'):Array.isArray(p.answer)?p.answer.map((x,i)=>i===0?x+7:x).join(', '):String(Number(p.answer)+7);
      if(p.check(wrong))wf=false;}
    ok('grade:'+k,rp&&wf);
  }catch(e){ok('grade:'+k+':'+e.message,false);}
});

const fails=out.filter(o=>!o.pass);
document.getElementById('report').innerHTML=
  `<h3>${fails.length===0?'✅ ALL '+out.length+' CHECKS PASS':'❌ '+fails.length+' FAILURES'}</h3>`+
  out.map(o=>`<div class="${o.pass?'OK':'BAD'}">${o.pass?'OK ':'BAD'} ${o.name}</div>`).join('');
</script></body></html>
